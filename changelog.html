<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyricpad — Changelog</title>
<meta name="description" content="What changed in Lyricpad, newest first.">
<script>
  // Match the theme chosen in the app.
  (function () {
    let t = "light";
    try { t = localStorage.getItem("lyricpad:theme") || "light"; } catch {}
    document.documentElement.dataset.theme = t === "dark" || t === "auto" ? t : "light";
  })();
</script>
<style>
:root{--bg:#f6f4ef;--card:#fffdf9;--ink:#23201b;--mut:#7a7368;--ln:#e4ded3;--ac:#b4532a;--acf:#fff;--warn:#b3261e;
--fd:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fm:ui-monospace,SFMono-Regular,Menlo,monospace;
color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--card:#201e1b;--ink:#ece6dc;--mut:#9a9286;--ln:#34312c;--ac:#e08a5f;--acf:#1f120b;--warn:#f2847b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171614;--card:#201e1b;--ink:#ece6dc;--mut:#9a9286;--ln:#34312c;--ac:#e08a5f;--acf:#1f120b;--warn:#f2847b;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--fb)}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 30px/1.1 var(--fd);margin:8px 0 6px;letter-spacing:-.02em}
h2{font-family:var(--fd);margin:26px 0 10px;padding-top:14px;border-top:1px solid var(--ln)}
a{color:var(--ac)}
b,strong{font-weight:650}
code{font-family:var(--fm);font-size:13.5px;background:var(--card);border:1px solid var(--ln);border-radius:4px;padding:1px 4px;overflow-wrap:anywhere}
.sub{color:var(--mut);margin:0 0 20px;font-size:15px}
.ver{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.ver .v{font-weight:700;font-size:20px;letter-spacing:-.01em}
.ver time{color:var(--mut);font:500 14px var(--fb)}
.ver .cur{font:700 12px var(--fb);background:var(--ac);color:var(--acf);border-radius:999px;padding:2px 9px}
section>p{margin:0 0 10px}
ul{list-style:none;padding:0;margin:8px 0 0}
li{display:flex;gap:10px;align-items:flex-start;margin:0 0 9px}
li>span:last-child{min-width:0}
li ul{margin:6px 0 0}
li li{display:list-item;list-style:disc;margin:0 0 4px 18px}
.tag{flex:0 0 auto;min-width:72px;text-align:center;font:700 11.5px var(--fb);letter-spacing:.02em;text-transform:uppercase;border-radius:6px;padding:2px 6px;margin-top:3px;border:1px solid var(--ln)}
.tag.new{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.tag.chg{background:var(--card);color:var(--ink)}
.tag.fix{background:var(--card);color:var(--warn);border-color:var(--warn)}
.msg{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}
@media (max-width:420px){li{flex-direction:column;gap:4px}.tag{min-width:0}}
</style>
</head>
<body>
<main>
<h1>Changelog</h1>
<p class="sub"><span id="intro">What changed in Lyricpad, newest first.</span> <a href="./">Back to the app</a></p>
<div id="log"><p class="msg">Loading…</p></div>
</main>
<script>
// Renders CHANGELOG.md (the single source of truth) next to this page.
(function () {
  const log = document.getElementById("log");
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const TAGS = { added: ["new", "New"], changed: ["chg", "Changed"], fixed: ["fix", "Fixed"], removed: ["chg", "Removed"] };
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  // Inline markdown on already-escaped text: `code`, **bold**, *italic*, [text](url).
  function inline(s) {
    const codes = [];
    s = esc(s).replace(/`([^`]+)`/g, (_, c) => (codes.push(c), "\u0000" + (codes.length - 1) + "\u0000"));
    s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
         .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<i>$2</i>")
         .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) =>
           /^(https?:\/\/|\.?\/|#|[\w.-]+(\.\w+)?$)/.test(u) ? `<a href="${u}">${t}</a>` : t)
         .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2">$2</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
  }
  function niceDate(d) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d);
    return m ? `${MON[+m[2] - 1]} ${+m[3]}, ${m[1]}` : d;
  }
  function render(md) {
    const out = [], intro = [];
    let sec = null, tag = null, item = null, sub = null;
    const close = () => { item = null; sub = null; };
    for (const raw of md.replace(/\r/g, "").split("\n")) {
      const line = raw.trimEnd();
      let m;
      if (/^#\s/.test(line)) continue;
      if ((m = /^##\s+(.*)$/.exec(line))) {
        close(); tag = null;
        const [, date, title] = /^(\d{4}-\d{2}-\d{2})?\s*(?:[—–-]\s*)?(.*)$/.exec(m[1]);
        sec = { date: date || "", title: title || "", body: [] };
        out.push(sec); continue;
      }
      if (!sec) { if (line) intro.push(line); continue; }
      if ((m = /^###\s+(.*)$/.exec(line))) {
        close();
        const k = m[1].trim().toLowerCase();
        tag = TAGS[k] || ["chg", m[1].trim()];
        continue;
      }
      if ((m = /^- (.*)$/.exec(line))) {
        item = { tag, text: m[1], subs: [] }; sub = null;
        sec.body.push(item); continue;
      }
      if (item && (m = /^\s{2,}- (.*)$/.exec(line))) { sub = { text: m[1] }; item.subs.push(sub); continue; }
      if (item && /^\s{2,}\S/.test(line)) { (sub || item).text += " " + line.trim(); continue; }
      if (!line) { close(); continue; }
      sec.body.push({ para: line });
    }
    if (!out.length) throw new Error("No entries found");
    let html = "";
    out.forEach((s, i) => {
      const id = (s.date || "entry") + (out.slice(0, i).some(o => o.date === s.date) ? "-" + i : "");
      html += `<section><h2 id="${esc(id)}"><span class="ver"><span class="v">${inline(s.title || niceDate(s.date))}</span>`;
      if (s.title && s.date) html += `<time datetime="${esc(s.date)}">${esc(niceDate(s.date))}</time>`;
      if (i === 0) html += `<span class="cur">Latest</span>`;
      html += `</span></h2>`;
      let open = false;
      for (const b of s.body) {
        if (b.para) { if (open) { html += "</ul>"; open = false; } html += `<p>${inline(b.para)}</p>`; continue; }
        if (!open) { html += "<ul>"; open = true; }
        const [cls, label] = b.tag || ["chg", "Note"];
        html += `<li><span class="tag ${cls}">${esc(label)}</span><span>${inline(b.text)}`;
        if (b.subs.length) html += "<ul>" + b.subs.map(x => `<li>${inline(x.text)}</li>`).join("") + "</ul>";
        html += "</span></li>";
      }
      if (open) html += "</ul>";
      html += "</section>";
    });
    if (intro.length) document.getElementById("intro").innerHTML = intro.map(inline).join(" ");
    log.innerHTML = html;
    if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
  }
  fetch("CHANGELOG.md", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(render)
    .catch(e => {
      log.innerHTML = '<p class="msg">The changelog couldn’t be loaded ({ERR}). <a href="https://github.com/gp-songtools/lyricpad/blob/main/CHANGELOG.md">View it on GitHub</a>.</p>'.replace("{ERR}", esc(String(e.message || e)));
    });
})();
</script>
</body>
</html>
